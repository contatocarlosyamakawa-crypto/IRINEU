<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111113">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Irineu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone column. Lime card = o que está livre; violeta = o que já tem dono (parcelas). Pílulas, cantos grandes, barra flutuante. Single dark look, by choice. */
:root{
  --bg:#111113; --surface:#1C1C21; --surface-2:#25252C; --line:#2C2C34; --fg:#F4F3F8; --muted:#A6A4B0; --dim:#75737F;
  --lime:#D6F35B; --violet:#7A4DF5; --violet-soft:#A78BFF; --ink:#111113;
  --accent:var(--lime); --on-accent:var(--ink); --good:#8FE3AE; --warn:#FF8A70;
  --display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif; --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:20px 132px;display:flex;flex-direction:column;gap:22px}
.mark{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.03em}
.mark i{font-style:normal;color:var(--lime)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--fg)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow.acc{color:var(--lime)}
.h1{font-family:var(--display);font-weight:400;letter-spacing:-.035em;line-height:.98;font-size:clamp(38px,11vw,50px);margin:0;text-wrap:balance}
.big{font-family:var(--display);font-weight:400;letter-spacing:-.05em;line-height:.88;font-size:clamp(56px,18vw,80px);font-variant-numeric:tabular-nums}
.cur{font-family:var(--display);font-weight:600;font-size:20px;opacity:.6}
.hero{display:flex;flex-direction:column;gap:12px}
.hero-num{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.neg .big{color:var(--warn)}
.sub{font-size:14px;color:var(--muted)}
.sub b{color:var(--fg)}
.chip-date{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:1px solid currentColor;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.pill-word{display:inline-block;border:2px solid currentColor;border-radius:999px;padding:0 .28em;line-height:1.02}
/* lime hero card */
.lime-card{background:var(--lime);color:var(--ink);border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.lime-card .sub{color:rgba(17,17,19,.66)}
.lime-card .sub b{color:var(--ink)}
.lime-card.neg{background:var(--warn)}
.ratio{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.ratio .of{font-family:var(--display);font-size:22px;font-weight:400;opacity:.55;letter-spacing:-.02em}
.bar{height:34px;border-radius:999px;background:rgba(17,17,19,.14);display:flex;overflow:hidden;padding:3px;gap:3px}
.bar span{border-radius:999px;min-width:6px}
.stripe{background:repeating-linear-gradient(-45deg,var(--violet) 0 7px,var(--violet-soft) 7px 13px)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.legend div{display:flex;flex-direction:column;gap:2px;min-width:0}
.legend small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.legend small i{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.legend strong{font-size:15px;font-variant-numeric:tabular-nums}
.lime-card .legend small{color:rgba(17,17,19,.66)}
/* violet panel */
.violet-panel{background:var(--violet);color:#fff;border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:16px}
.violet-panel .sub,.violet-panel small{color:rgba(255,255,255,.75)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:18px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-h h2{font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:-.02em;margin:0}
.pilllink{white-space:nowrap;flex-shrink:0;border:1px solid currentColor;background:transparent;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:inherit;min-height:32px}
.months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.months div{display:flex;flex-direction:column;gap:8px;min-width:0}
.months .col{height:96px;display:flex;align-items:flex-end;background:rgba(255,255,255,.12);border-radius:16px;padding:4px}
.months .col span{width:100%;background:var(--lime);border-radius:12px;min-height:6px}
.months b{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.months small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.meter{display:flex;gap:3px;height:12px}
.meter span{border-radius:6px;min-width:3px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .txt strong{font-weight:600;overflow-wrap:anywhere}
.row .txt small{font-size:12px;color:var(--muted)}
.row .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .val.in{color:var(--good)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:-.02em}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.x.sure{background:var(--warn);border-color:var(--warn);color:var(--ink);width:auto;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700}
.rowbtn{width:100%;background:none;border:none;border-bottom:1px solid var(--line);text-align:left;color:inherit;font:inherit;cursor:pointer;border-radius:0}
.rowbtn:active{background:var(--surface)}
.opl{display:flex;gap:10px;align-items:flex-start;padding:3px 0}
.op{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.opa{background:var(--lime);color:var(--ink)}.opu{background:var(--violet);color:#fff}.opr{background:var(--warn);color:var(--ink)}.opq{background:var(--line);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.btn{min-height:56px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:15px;padding:0 22px}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.btn.go{display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 26px}
.btn.go .arw{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--lime);display:flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:14px;min-height:44px;padding:0;text-align:left}
textarea{width:100%;min-height:120px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px 18px;font-size:16px;line-height:1.45}
textarea:focus,textarea:focus-visible,input:focus,input:focus-visible,select:focus,select:focus-visible{outline:none;box-shadow:none}
textarea:focus{border-color:var(--line)}
.field:focus-within{border-color:var(--dim)}
*{-webkit-tap-highlight-color:transparent}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.tip svg{flex-shrink:0;color:var(--lime);margin-top:1px}
.said{font-style:italic;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px}
.total b{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:-.03em;color:var(--lime);font-variant-numeric:tabular-nums}
.prog{display:flex;gap:6px}
.prog span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog span.on{background:var(--lime)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:18px;padding:8px 14px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:11px;color:var(--muted)}
.field input,.field select{background:transparent;border:none;font-weight:700;font-size:15px;padding:2px 0;width:100%;min-width:0}
.field select option{background:var(--surface)}
.impact{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.impact i{width:8px;height:8px;border-radius:50%;background:var(--lime);margin-top:7px;flex-shrink:0}
.bubble{border-radius:24px;padding:14px 18px;max-width:88%;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--lime);color:var(--ink);border-bottom-right-radius:8px;font-weight:600}
.bubble.ir{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:8px}
.bubble.hi{background:var(--violet);border-color:var(--violet);color:#fff}
.chat{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{text-align:left;min-height:48px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:14px}
.ask{display:flex;gap:8px;align-items:flex-end}
.ask textarea{resize:none;min-height:56px;height:56px;flex:1;min-width:0;border-radius:28px}
.tons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tons button{min-height:44px;border-radius:999px;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px}
.tons button.on{background:var(--lime);color:var(--ink)}
/* floating nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.nav-in{pointer-events:auto;max-width:428px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;background:rgba(28,28,33,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:6px}
.nav button{background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;font-size:10px;font-weight:700;border-radius:999px}
.nav button.on{color:var(--fg)}
.nav button.on svg{color:var(--lime)}
.nav .mic{width:58px;height:58px;min-height:58px;margin:0 auto;border-radius:50%;background:var(--lime);color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.sheet .wrap{padding-block:20px 40px;gap:20px;min-height:100%}
.close{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top,0px));z-index:60;max-width:430px;margin:0 auto;background:var(--lime);color:var(--ink);border-radius:999px;padding:14px 20px;font-weight:700;font-size:14px;animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
@keyframes blink{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
.thinking{animation:blink 1.2s ease-in-out infinite;color:var(--muted)}
/* welcome */
.welcome-bg{background:var(--violet);color:#fff;min-height:100%}
.welcome{min-height:calc(100vh - 20px);justify-content:space-between;padding-block:20px 28px}
.badge{width:116px;height:116px;border-radius:50%;background:var(--lime);color:var(--ink);position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.badge svg.ring{position:absolute;inset:0;animation:spin 18s linear infinite}
.tilt{display:flex;flex-direction:column;gap:10px}
.tilt span{align-self:flex-start;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px}
.tilt span:nth-child(1){background:var(--lime);color:var(--ink);transform:rotate(-3deg)}
.tilt span:nth-child(2){background:var(--ink);color:#fff;transform:rotate(2deg);margin-left:24px}
.tilt span:nth-child(3){border:2px solid #fff;transform:rotate(-1.5deg);margin-left:8px}
.steps{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:14px}
.callhead{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
.callhead .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.callhead strong{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.02em}
.callhead small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.live{width:8px;height:8px;border-radius:50%;background:var(--good);animation:blink 1.6s ease-in-out infinite}
.live.wait{background:var(--lime)}
.ava{width:52px;height:52px;border-radius:50%;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.04em;flex-shrink:0;position:relative}
.ava b{color:var(--violet)}
.ava.talk::after,.ava.big::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--lime);animation:ring 1.4s ease-out infinite}
.ava.big{width:72px;height:72px;font-size:30px;background:var(--ink);color:var(--lime)}
.ava.big::after{border-color:var(--ink)}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.35);opacity:0}}
.anot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px;width:100%;text-align:left;color:inherit}
.anot span{display:flex;flex-direction:column;gap:2px;min-width:0}
.anot small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anot b{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anotl{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;white-space:normal}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(to bottom,rgba(17,17,19,0),var(--bg) 22%);padding:28px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:428px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.btn.sm{min-height:46px;font-size:14px;padding:0 14px}
.waitcard{background:var(--lime);color:var(--ink);border-radius:30px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.waitcard strong{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.02em}
.err{color:var(--warn);font-size:13px}
.callwrap{padding-bottom:320px;gap:14px}
.callhead{gap:8px}
.callhead small{white-space:nowrap}
.callhead .iconbtn,.callhead .hang{width:42px;height:42px}
.callhead .ava{width:46px;height:46px;font-size:20px}
.dock{background:var(--bg);border-top:1px solid var(--line);padding-top:14px}
.hang{width:44px;height:44px;border-radius:50%;border:none;background:var(--warn);color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hang svg{transform:rotate(135deg)}
.hang.pulse{animation:hp 1.6s infinite}
@keyframes hp{0%{box-shadow:0 0 0 0 rgba(255,138,112,.6)}100%{box-shadow:0 0 0 12px rgba(255,138,112,0)}}
.roteiro{display:flex;flex-wrap:wrap;gap:6px}
.roteiro span{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.roteiro span.ok{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.cap p{margin:0;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.22;letter-spacing:-.015em;text-wrap:pretty}
.cap.dim{opacity:.55}
.qr{display:flex;flex-wrap:wrap;gap:8px}
.qchip{min-height:44px;padding:0 16px;border-radius:999px;border:none;background:var(--lime);color:var(--ink);font-weight:700;font-size:14px}
.qchip.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.tipline{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.tipline svg{color:var(--lime);flex-shrink:0;width:14px;height:14px}
.bubble.small{font-size:14px;padding:12px 16px;opacity:.85}
.bubble.pend{opacity:.75}
.pendl{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:4px}
.anotrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.anotchip{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;min-height:32px}
.qb{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--warn);color:var(--ink);font-weight:800;font-size:12px;flex-shrink:0}
.qnote{background:var(--surface);border:1px solid var(--warn);border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.5}
.dayh{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:16px 0 4px;font-variant-numeric:tabular-nums}
.callbar{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 16px;color:var(--fg);font-weight:600;font-size:14px;text-align:left}
.callbar b{margin-left:auto;color:var(--lime)}
.toast{display:flex;align-items:center;justify-content:space-between;gap:12px;top:auto;bottom:calc(98px + env(safe-area-inset-bottom,0px))}
.toast.up{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}
.toast[hidden]{display:none}
.toast button{background:var(--ink);color:var(--lime);border:none;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;flex-shrink:0}
#call-send{width:56px;padding:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#calltxt{min-height:56px;height:56px;max-height:150px;line-height:1.4}
[hidden]{display:none!important}
.tgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end}
.tcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;background:none;border:none;color:inherit;font:inherit;padding:4px 0;border-radius:14px;cursor:pointer}
.tcol.sel{background:var(--surface-2)}
.dbar{display:flex;height:18px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface-2)}
.dbar span{display:block;height:100%}
.drow{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.drow i{width:12px;height:12px;border-radius:4px}
.dn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.drow b{font-variant-numeric:tabular-nums}
.ttube{display:flex;width:100%;max-width:34px;height:112px;border-radius:999px;background:var(--surface-2);display:flex;align-items:flex-end;overflow:hidden}
.ttube span{display:block;width:100%;border-radius:999px}
.tpct{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

<body>
<div id="app"><div class="wrap"><span class="mark">irineu<i>.</i></span><span class="sub">Abrindo seus dados…</span></div></div>
<div id="toast" class="toast" hidden></div>

<script>
const CATS=['Alimentação','Mercado','Delivery','Transporte','Casa','Saúde','Lazer','Vestuário','Educação','Assinaturas','Presentes','Outros'];
let CARDS=['Nubank','C6','Santander','Dinheiro','Outro'];
function userCards(){const c=S.profile&&Array.isArray(S.profile.cartoes)&&S.profile.cartoes.length?S.profile.cartoes:['Nubank','C6','Santander'];return c.filter(x=>x!=='Dinheiro'&&x!=='Outro')}
function syncCards(){CARDS=[...userCards(),'Dinheiro','Outro']}
function cardEnum(cash){return CARDS.filter(c=>cash||c!=='Dinheiro').map(c=>'"'+c+'"').join('|')}
const FORMAS=['crédito','débito','pix','dinheiro'];
const CARD_DOT={Nubank:'#A646E0',C6:'#C9C7BF',Santander:'#EC2B2B',Dinheiro:'#8FE3AE',Outro:'#6E6C66'};
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const STEPS=[
  {key:'renda',tag:'01 · Quanto entra',q:'Quanto você ganha por mês?',ex:'Recebo 6.500 de salário todo dia 5 e uns 800 de freela.',label:'Entra por mês'},
  {key:'fixas',tag:'02 · O que é fixo',q:'Quais contas chegam todo mês?',ex:'Aluguel 1.800 dia 10, condomínio 450, internet 120, academia 99 e streaming 55.',label:'Fixo por mês',skip:'Não tenho contas fixas'},
  {key:'parcelas',tag:'03 · O que está parcelado',q:'Tem compra parcelada rolando?',ex:'Notebook 320 por mês no Nubank, faltam 6. Fone 133 no C6, faltam 2.',label:'Parcelas por mês',skip:'Não tenho parcelas'}
];
const MIC='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const XI='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

const S={ready:false,profile:null,gastos:[],tab:'home',mode:'app',ob:0,draft:{renda:[],fixas:[],variaveis:[],parcelas:[]},obText:'',obItems:null,obSaid:'',obTom:'amigo',busy:false,err:'',
  sheet:false,addText:'',pending:null,gedit:null,gSure:false,edit:null,editSure:false,call:null,callText:'',lastUndo:null,confirmWipe:false,setup:false,keyMsg:'',impMsg:'',medit:null,cardSure:null,pv:null};
let DB=null,UID=null,SAMPLE=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.abs(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl=n=>(n<0?'− ':'')+'R$ '+fmt(n);
const ymOf=d=>d.getFullYear()*12+d.getMonth();
const NOW=()=>new Date();
function num(s){s=String(s).trim();if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');return parseFloat(s.replace(',','.'))||0}
function toast(t,label,fn){const el=$('#toast');el.innerHTML='<span>'+esc(t)+'</span>'+(label?'<button data-act="toastAct">'+esc(label)+'</button>':'');toast.fn=fn||null;el.classList.toggle('up',S.mode==='call');el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true;toast.fn=null},label?5000:2800)}

/* ---------- storage ---------- */
function profRef(){return DB.doc('data/users/'+UID+'/irineu')}
async function boot(){
  const k=getKey();if(k)SAMPLE=makeAI(k);
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
  try{await load()}catch(e){S.err='Não consegui abrir seus dados agora. Tente recarregar.'}
  syncCards();S.ready=true;
  if(!getKey()&&!S.profile)S.setup=true;
  if(!S.profile||!S.profile.onboarded){S.mode='ob';S.ob=0}
  try{const k=await loadCall();if(k&&!k.done&&Array.isArray(k.log)){S.call={...k,busy:false,duvidas:k.duvidas||[],feitos:k.feitos||[],draftGastos:k.draftGastos||[],
    draft:k.draft||{renda:[],fixas:[],variaveis:[],parcelas:[]},mode:k.mode||(S.profile&&S.profile.onboarded?'livre':'intro')};S.mode='call'}}catch(e){}
  try{S.callText=localStorage.getItem('irineu_calltxt')||''}catch(e){}
  render();
  if(S.call)processQueue();
}
async function load(){
  if(DB){
    const s=await profRef().get();S.profile=s.exists?{...s.data()}:null;
    const q=await profRef().collection('gastos').orderBy('ts','desc').limit(500).get();
    S.gastos=q.docs.map(d=>({id:d.id,...d.data()}));
  }else{
    try{const j=JSON.parse(localStorage.getItem('irineu')||'null');if(j){S.profile=j.profile;S.gastos=j.gastos||[]}}catch(e){}
  }
}
function saveLocal(){try{localStorage.setItem('irineu',JSON.stringify({profile:S.profile,gastos:S.gastos}))}catch(e){}}
async function saveProfile(p){S.profile=p;syncCards();if(DB){await profRef().set(p)}else saveLocal()}
async function addGasto(g){
  if(DB){const ref=profRef().collection('gastos').doc();await ref.set(g);S.gastos.unshift({id:ref.id,...g})}
  else{S.gastos.unshift({id:'l'+Date.now(),...g});saveLocal()}
}
async function delGasto(id){
  if(DB)await profRef().collection('gastos').doc(id).delete();
  S.gastos=S.gastos.filter(g=>g.id!==id);if(!DB)saveLocal();
}
async function wipe(){
  if(DB){for(const g of S.gastos)await profRef().collection('gastos').doc(g.id).delete();await profRef().delete()}
  else{try{localStorage.removeItem('irineu')}catch(e){}}
  S.profile=null;S.gastos=[];
}

/* ---------- money math ---------- */
function activeParcelas(off){
  const ym=ymOf(NOW())+off,out=[];
  for(const p of (S.profile?.parcelas||[])){const r=p.restantes-(ym-p.base);if(r>=1&&!(p.desde&&ym<p.desde))out.push({nome:p.nome,valor:p.valor,cartao:p.cartao,rest:r,total:null,origem:'intro'})}
  for(const g of S.gastos){if(g.entrada||!(g.parcelas>1))continue;const r=g.parcelas-(ym-g.ym);if(r>=1&&r<=g.parcelas)out.push({nome:g.descricao,valor:g.valor_total/g.parcelas,cartao:g.cartao,rest:r,total:g.parcelas,origem:'voz'})}
  return out;
}
function ativo(x,ym){return (!x.fim||ym<=x.fim)&&(!x.desde||ym>=x.desde)}
function sumAt(list,ym){return (list||[]).filter(x=>ativo(x,ym)).reduce((a,x)=>a+x.valor,0)}
function ymLabel(ym){return MES3[ym%12]+'/'+String(Math.floor(ym/12)).slice(2)}
function metaGuardado(m){return (m.aportes||[]).reduce((a,x)=>a+x.valor,0)}
function guardadoNo(ym){return ((S.profile&&S.profile.metas)||[]).reduce((a,m)=>a+(m.aportes||[]).filter(x=>x.ym===ym).reduce((b,x)=>b+x.valor,0),0)}
function monthAt(off){const ym=ymOf(NOW())+off;
  if(off===0){const m=month();return {ym,entra:m.entra,comp:m.fixas+m.parc+m.gasto+m.guardado,livre:m.livre}}
  const gm=S.gastos.filter(g=>g.ym===ym),p=S.profile||{};
  const entra=sumAt(p.renda,ym)+gm.filter(g=>g.entrada).reduce((a,g)=>a+g.valor_total,0);
  const comp=sumAt(p.fixas,ym)+sumAt(p.variaveis,ym)+activeParcelas(off).reduce((a,x)=>a+x.valor,0)+gm.filter(g=>!g.entrada&&!(g.parcelas>1)).reduce((a,g)=>a+g.valor_total,0)+guardadoNo(ym);
  return {ym,entra,comp,livre:entra-comp}}
function climaOf(pct,entra){return entra<=0?{nome:'sem renda',cor:'var(--dim)'}:pct<=60?{nome:'leve',cor:'var(--lime)'}:pct<=80?{nome:'atenção',cor:'#FFB547'}:{nome:'apertado',cor:'var(--warn)'}}
function month(extra){
  const now=NOW(),ym=ymOf(now);
  const gm=S.gastos.filter(g=>g.ym===ym);
  if(extra)gm.push(extra);
  const renda=sumAt(S.profile?.renda,ym);
  const entradas=gm.filter(g=>g.entrada).reduce((a,g)=>a+g.valor_total,0);
  const fixas=sumAt(S.profile?.fixas,ym)+sumAt(S.profile?.variaveis,ym);
  let parc=activeParcelas(0).reduce((a,p)=>a+p.valor,0);
  if(extra&&!extra.entrada&&extra.parcelas>1)parc+=extra.valor_total/extra.parcelas;
  const gasto=gm.filter(g=>!g.entrada&&!(g.parcelas>1)).reduce((a,g)=>a+g.valor_total,0);
  const guardado=guardadoNo(ym),entra=renda+entradas,livre=entra-fixas-parc-gasto-guardado;
  const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),left=dim-now.getDate()+1;
  return {entra,fixas,parc,gasto,guardado,livre,left,perDay:livre/left,gm};
}

/* ---------- AI parsing ---------- */
async function askJSON(prompt){
  if(!SAMPLE)return null;
  try{return await SAMPLE.json(prompt,{modelTier:'quick'})}
  catch(e){const c=e&&e.code;if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c))SAMPLE=null;return null}
}
function splitSegs(t){return t.split(/[;\n]|\.\s+|,(?!\s*(?:faltam|falta|dia|\d))|\se\s(?=[^,]*\d)/i).map(s=>s.trim()).filter(Boolean)}
function firstNum(s){const m=s.match(/\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?/);return m?num(m[0]):0}
function cardOf(s){const l=normKey(String(s).replace(/\bc6\b/gi,'cseis'));
  for(const c of CARDS){if(c==='Dinheiro'||c==='Outro')continue;const k=normKey(c);if(k&&k!=='c6'&&new RegExp('(^| )'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'( |$)').test(l))return c}
  if(/(^| )nu( |$)/.test(l)&&CARDS.includes('Nubank'))return'Nubank';if(/cseis/.test(l)&&CARDS.includes('C6'))return'C6';if(/dinheiro|especie/.test(l))return'Dinheiro';return'Outro'}
function cleanName(s){
  const n=s.replace(/\bc6\b|cseis/gi,' ').replace(/r\$|\d+(?:[.,]\d+)*/gi,' ').replace(/(^|\s)(reais|por|m[eê]s|todo|dia|faltam?|parcelas?|no|na|do|da|de|em|recebo|ganho|uns|umas|mais|ou|menos|nubank|santander|c6|cart[aã]o|cr[eé]dito|d[eé]bito|pix|x|e|o|a)(?=\s|$|[.,])/gi,' ')
    .replace(/[.,;]/g,' ').replace(/\s+/g,' ').trim();
  return n.length>1?n:'';
}
const ISNUM=/^\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?$|^\d+(?:,\d{1,2})?$/;
const FILL=new Set('e o a os as de do da dos das no na em um uma uns umas deu dá da foi é ficou fica esse essa este esta isso mês mes tá ta tô to com pra para meu minha meus minhas tenho tem pago pagando paguei gasto gastei r$ reais real por ainda mais ou menos que aí ai também tambem agora eu ele mensal todo toda cada valor vem vence sai recebo recebi ganho ganhei comprei salário_'.split(' '));
const MODS=/^(dia|faltam|falta|faltando|restam|x|vezes|parcelas?|cancelei|cancelou|quitei|quitou|acabou|terminou|tira|tirar|remove|remover)$/;
function chunks(t){
  /* lê a fala palavra a palavra: cada valor fecha um item; "dia 10", "faltam 6", "no Nubank" grudam no item certo */
  const tk=t.replace(/\bc6\b/gi,'cseis').split(/\s+/).map(w=>w.replace(/^[(“"']+|[,.;:!?)”"']+$/g,'')).filter(Boolean);
  const items=[];let cur={words:[],raw:[],valor:0};
  const close=()=>{if(cur.valor>0||cur.remove)items.push(cur);cur={words:[],raw:[],valor:0}};
  const target=()=>cur.valor>0||cur.words.length||!items.length?cur:items[items.length-1];
  for(let i=0;i<tk.length;i++){
    const w=tk[i],lw=w.toLowerCase(),prev=(tk[i-1]||'').toLowerCase(),next=(tk[i+1]||'').toLowerCase();
    let m;
    if((m=lw.match(/^(\d+)x$/))){const tg=target();tg.parc=+m[1];tg.raw.push(w);continue}
    if(ISNUM.test(w)){const n=num(w),tg=target();
      if(prev==='dia'){tg.dia=n;tg.raw.push(w);continue}
      if(/^(faltam|falta|faltando|restam)$/.test(prev)){tg.rest=n;tg.raw.push(w);continue}
      if(/^(x|vezes|parcelas?)$/.test(next)&&n<=48&&!(cur.valor===0&&prev==='de')){tg.parc=n;tg.raw.push(w);continue}
      if(cur.valor>0)close();
      cur.valor=n;cur.raw.push(w);continue}
    if(/^(nubank|nu|cseis|santander)$/.test(lw)){const tg=target();tg.cartao=cardOf(lw);tg.raw.push(w);continue}
    if(MODS.test(lw)){const tg=target();if(/cancel|quit|acab|termin|tira|remov/.test(lw))tg.remove=true;tg.raw.push(w);continue}
    if(FILL.has(lw)){(cur.valor>0?{raw:[]}:cur).raw.push(w);continue}
    if(cur.valor>0&&!(cur.words.length===0&&/^(de|do|da|com|em|no|na)$/.test(prev)))close();
    cur.words.push(w);cur.raw.push(w);
  }
  close();
  return items.map(c=>{let nome=c.words.join(' ').replace(/cseis/gi,'C6').slice(0,40);nome=nome?nome.charAt(0).toUpperCase()+nome.slice(1):'';
    return {text:c.raw.join(' ').replace(/cseis/gi,'c6'),nome,valor:c.valor,dia:c.dia||null,rest:c.rest||null,parc:c.parc||null,cartao:c.cartao||null,remove:!!c.remove}});
}
function localList(key,t){
  return chunks(t).filter(c=>c.valor>0).map(c=>{const it={nome:c.nome||'Item',valor:c.valor};
    if(key==='parcelas'){it.restantes=c.rest||c.parc||1;it.cartao=c.cartao||'Outro'}else it.dia=c.dia;
    return it});
}
async function parseList(key,t){
  const shapes={
    renda:'{"itens":[{"nome":string,"valor":number,"dia":inteiro ou null}]} — cada fonte de renda mensal (salário, freela, etc.), valor em reais por mês.',
    fixas:'{"itens":[{"nome":string,"valor":number,"dia":inteiro ou null}]} — cada conta fixa mensal, valor em reais por mês, dia de vencimento se dito.',
    parcelas:'{"itens":[{"nome":string,"valor":number,"cartao":'+cardEnum()+',"restantes":inteiro}]} — cada compra parcelada: valor de CADA parcela em reais e quantas parcelas ainda faltam pagar contando a deste mês.'
  };
  const r=await askJSON('Extraia dados financeiros desta frase em português do Brasil: "'+t+'"\nResponda só com JSON no formato '+shapes[key]+' Nomes curtos com inicial maiúscula. Números como 1.800 significam mil e oitocentos.');
  const loc=localList(key,t);
  if(r&&Array.isArray(r.itens)&&r.itens.length>=loc.length){
    return r.itens.map(x=>({nome:String(x.nome||'Item').slice(0,40),valor:Number(x.valor)||0,dia:x.dia?Number(x.dia):null,cartao:x.cartao?String(x.cartao):undefined,restantes:x.restantes?Math.max(1,Math.round(Number(x.restantes))):undefined})).filter(x=>x.valor>0).map(x=>{if(key==='parcelas'){x.restantes=x.restantes||1;x.cartao=CARDS.includes(x.cartao)?x.cartao:'Outro';delete x.dia}else{delete x.cartao;delete x.restantes}return x});
  }
  return loc;
}
function localGasto(t){
  const l=t.toLowerCase();
  const x=l.match(/(\d+)\s*x\s*(?:de\s*)?(?:r\$\s*)?(\d[\d.,]*)/);
  let parcelas=1,total=firstNum(t);
  if(x){parcelas=+x[1];total=num(x[2])*parcelas}
  else{const p=l.match(/(?:em\s*)?(\d+)\s*(?:x|vezes|parcelas)/);if(p&&+p[1]!==total){parcelas=+p[1]}}
  let desc=cleanName(userCards().reduce((x,c)=>x.replace(new RegExp('(cart[aã]o\\s+d[aoe]\\s+)?\\b'+c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi'),' '),t).replace(/(gastei|comprei|paguei|recebi|ganhei|um|uma|em\s*\d+\s*x)/gi,' ')).slice(0,32)||'Gasto';
  desc=desc.charAt(0).toUpperCase()+desc.slice(1);
  const forma=/pix/.test(l)?'pix':/d[eé]bito/.test(l)?'débito':/dinheiro/.test(l)?'dinheiro':'crédito';
  return {descricao:desc,valor_total:total,parcelas,cartao:cardOf(t),forma,categoria:'Outros',entrada:/receb|ganhei|entrou|caiu/.test(l)};
}
async function parseGasto(t){
  const r=await askJSON('Você interpreta um gasto falado em português do Brasil.\nFrase: "'+t+'"\nCartões e contas do usuário: '+userCards().join(', ')+'.\nResponda só com JSON: {"descricao": string curta (ex.: "Tênis", "Mercado"), "valor_total": number em reais, "parcelas": inteiro >= 1, "cartao": '+cardEnum(1)+', "forma": "crédito"|"débito"|"pix"|"dinheiro", "categoria": um de '+JSON.stringify(CATS)+', "entrada": boolean (true se for dinheiro que o usuário recebeu)}.\nRegras: "4x de 150" significa valor_total 600 e parcelas 4. "600 em 4x" significa valor_total 600. Sem parcelamento dito, parcelas 1. Pix recebido é entrada.');
  if(r&&Number(r.valor_total)>0){
    return {descricao:String(r.descricao||'Gasto').slice(0,40),valor_total:Number(r.valor_total),parcelas:Math.max(1,Math.round(Number(r.parcelas)||1)),
      cartao:CARDS.includes(r.cartao)?r.cartao:'Outro',forma:FORMAS.includes(r.forma)?r.forma:'crédito',categoria:CATS.includes(r.categoria)?r.categoria:'Outros',entrada:!!r.entrada};
  }
  return localGasto(t);
}

/* ---------- bloco de anotações: tudo de uma vez ---------- */
const KEYS={renda:'Renda',fixas:'Conta fixa',variaveis:'Conta variável',parcelas:'Parcela'};
const TIPO2KEY={renda:'renda',fixa:'fixas',variavel:'variaveis',parcela:'parcelas'};
function prof(){const p=S.profile||{};return {...p,renda:p.renda||[],fixas:p.fixas||[],variaveis:p.variaveis||[],parcelas:p.parcelas||[]}}
function restOf(x){return x.restantes-(ymOf(NOW())-(x.base??ymOf(NOW())))}
function guessTipo(seg){const l=seg.toLowerCase();
  if(/faltam?|parcela|\d+\s*x\b|vezes/.test(l))return'parcela';
  if(/sal[aá]rio|recebo|ganho|freela|renda|entra/.test(l))return'renda';
  if(/varia|obra|reforma|mais ou menos|em m[eé]dia|\buns\b|\bumas\b|luz|[aá]gua|g[aá]s|energia|mercado/.test(l))return'variavel';
  return'fixa'}
function localBatch(t){
  return chunks(t).map(c=>{const tipo=c.rest||c.parc?'parcela':guessTipo(c.text);
    const a={acao:c.remove?'remover':'adicionar',tipo,nome:c.nome||'Item',valor:c.valor||null};
    if(tipo==='parcela'){a.restantes=c.rest||c.parc||1;a.cartao=c.cartao||'Outro'}else a.dia=c.dia;
    return a})}
async function parseBatch(t){
  const p=prof(),known={renda:p.renda.map(x=>x.nome),fixas:p.fixas.map(x=>x.nome),variaveis:p.variaveis.map(x=>x.nome),parcelas:p.parcelas.map(x=>x.nome)};
  const loc=localBatch(t);
  const r=await askJSON('Você é o assistente de anotações de um app de finanças pessoais. O usuário falou, em português do Brasil, possivelmente sem pontuação porque foi ditado: "'+t+'"\n'+
    'O que ele já tem cadastrado: '+JSON.stringify(known)+'\n'+
    'Transforme a fala em uma lista de ações, UMA para cada item mencionado (não junte itens). Responda só com JSON: {"acoes":[{"acao":"adicionar"|"atualizar"|"remover","tipo":"renda"|"fixa"|"variavel"|"parcela","nome":string,"valor":number|null,"dia":inteiro|null,"restantes":inteiro|null,"cartao":'+cardEnum()+'|null}]}\n'+
    'Regras: fixa = mesmo valor todo mês (aluguel, internet, academia, streaming). variavel = compromisso mensal cujo valor muda de um mês pro outro (obra, reforma, luz, água, gás, mesada); valor é o deste mês. parcela = compra parcelada: valor é o de CADA parcela e restantes é quantas faltam contando a deste mês. renda = dinheiro que entra. '+
    'Use "atualizar" quando ele mudar valor, dia ou parcelas de algo que já existe, repetindo exatamente o nome cadastrado. Use "remover" quando disser que acabou, quitou ou cancelou. Números como 1.800 significam mil e oitocentos. Nomes curtos com inicial maiúscula.');
  if(r&&Array.isArray(r.acoes)&&r.acoes.length>=Math.min(loc.length,1)&&r.acoes.length>=loc.length-1){
    return r.acoes.map(a=>({acao:['adicionar','atualizar','remover'].includes(a.acao)?a.acao:'adicionar',tipo:TIPO2KEY[a.tipo]?a.tipo:'fixa',nome:String(a.nome||'Item').slice(0,40),
      valor:a.valor==null?null:Number(a.valor),dia:a.dia?Number(a.dia):null,restantes:a.restantes?Math.max(1,Math.round(Number(a.restantes))):null,cartao:CARDS.includes(a.cartao)?a.cartao:null}))
      .filter(a=>a.acao==='remover'||a.valor>0||(a.acao==='atualizar'&&(a.dia||a.restantes)));
  }
  return loc;
}
function findItem(p,nome,prefer){const n=nome.toLowerCase().trim(),order=[prefer,...Object.keys(KEYS).filter(k=>k!==prefer)];
  for(const k of order){const i=p[k].findIndex(x=>x.nome.toLowerCase().trim()===n);if(i>=0)return{k,i}}
  for(const k of order){const i=p[k].findIndex(x=>x.nome.toLowerCase().includes(n)||n.includes(x.nome.toLowerCase()));if(i>=0)return{k,i}}
  return null}
function applyActions(acts,base){
  const p=JSON.parse(JSON.stringify(base||prof())),lines=[],ym=ymOf(NOW());
  for(const a of acts){const key=TIPO2KEY[a.tipo]||'fixas',hit=findItem(p,a.nome,key);
    if(a.acao==='remover'){if(hit){lines.push({op:'−',txt:p[hit.k][hit.i].nome+' saiu de '+KEYS[hit.k].toLowerCase()});p[hit.k].splice(hit.i,1)}else lines.push({op:'?',txt:'Não achei "'+a.nome+'" pra remover'});continue}
    if(hit&&(a.acao==='atualizar'||hit.k===key)){const x=p[hit.k][hit.i],ch=[];
      if(a.valor>0&&a.valor!==x.valor){ch.push(brl(x.valor)+' → '+brl(a.valor));x.valor=a.valor}
      if(a.dia&&hit.k!=='parcelas'){x.dia=a.dia;ch.push('dia '+a.dia)}
      if(a.restantes&&hit.k==='parcelas'){x.restantes=a.restantes;x.base=ym;ch.push('faltam '+a.restantes)}
      if(a.cartao&&hit.k==='parcelas')x.cartao=a.cartao;
      lines.push({op:'~',txt:x.nome+(ch.length?': '+ch.join(', '):' sem mudança')});continue}
    const it={nome:a.nome,valor:a.valor||0};
    if(key==='parcelas'){it.restantes=a.restantes||1;it.cartao=a.cartao||'Outro';it.base=ym}else it.dia=a.dia||null;
    p[key].push(it);
    lines.push({op:'+',txt:it.nome+' · '+brl(it.valor)+(key==='parcelas'?' por mês, faltam '+it.restantes:'')+' · '+KEYS[key].toLowerCase()});
  }
  return {p,lines};
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const MICST={on:false,listening:false,buf:'',timer:null,rec:null,target:null,fails:0};
let SPEAKING=false,spkT=null,spkId=0;
function micStart(target){if(!SR){toast('Este navegador não reconhece voz. Abre o Irineu pelo Chrome.');return}
  MICST.target=target;MICST.on=true;MICST.fails=0;micUI();listen()}
function micStop(){MICST.on=false;clearTimeout(MICST.timer);try{MICST.rec&&MICST.rec.abort()}catch(e){}MICST.listening=false;micUI()}
function listen(){
  if(!MICST.on||MICST.listening||SPEAKING||document.hidden)return;
  const r=new SR();MICST.rec=r;r.lang='pt-BR';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  r.onstart=()=>{MICST.listening=true;micUI()};
  r.onspeechstart=()=>{clearTimeout(MICST.timer)};
  r.onresult=e=>{let interim='',fin='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else interim+=t}
    if(fin){MICST.buf=(MICST.buf+' '+fin).trim();MICST.fails=0}
    showLive((MICST.buf+' '+interim).trim())};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){MICST.on=false;toast('Libera o microfone pro Irineu nas permissões do Chrome.')}else if(e.error==='no-speech')MICST.fails++};
  r.onend=()=>{MICST.listening=false;
    if(MICST.buf){clearTimeout(MICST.timer);MICST.timer=setTimeout(flushMic,MICST.target==='sheet'?700:1400)}
    if(MICST.on&&MICST.target==='call'){if(MICST.fails>=3)MICST.on=false;else setTimeout(listen,250)}
    else if(MICST.target==='sheet'&&!MICST.buf)MICST.on=false;
    micUI()};
  try{r.start()}catch(e){}
}
function showLive(t){const ta=$(MICST.target==='sheet'?'#addtxt':'#calltxt');if(ta&&MICST.on){ta.value=t;if(MICST.target==='call')S.callText=t;else S.addText=t}}

  else if(MICST.target==='sheet'){MICST.on=false;const ta=$('#addtxt');if(ta)ta.value=t;S.addText=t;micUI();A.quickAdd()}}

async function processQueue(){

  c.busy=true;c.retry=false;updateCall();
  let r=null;try{r=await callAI(batch.map(e=>e.text))}catch(e){r=null}
  if(S.call!==c)return;
  if(!r){c.busy=false;c.retry=true;const t='Caiu a linha um segundo. Toca em tentar de novo, eu não perdi o que você falou.';c.log.push({who:'ir',text:t,local:true});await saveCall();updateCall();scrollEnd();speak(t);return}
  let res;try{res=await applyCallResult(r)}catch(e){res={lines:[{op:'?',txt:'Não consegui salvar parte disso agora.'}],undo:null}}
  batch.forEach(e=>{delete e.pend});
  c.duvidas=r.duvidas;c.feitos=[...new Set([...(c.feitos||[]),...r.feitos])];if(r.terminou)c.ended=true;c.hangAsk=false;
  const entry={who:'ir',text:r.resposta,lines:res.lines};c.log.push(entry);
  S.lastUndo=res.undo&&res.lines.some(l=>l.op!=='?')?{entry,undo:res.undo}:null;
  c.busy=false;await saveCall();updateCall();scrollEnd();speak(r.resposta);
  if(c.log.some(e=>e.who==='eu'&&e.pend))processQueue();
}

async function resolveDuvida(opt){const c=S.call,d=c&&(c.duvidas||[])[0];if(!d)return;S.lastUndo=null;
  c.log.push({who:'eu',text:opt});

function localAnswer(t){if(t.length>110)return null;const l=normKey(t);
  if(!/^(quanto|quantos|quais|qual|onde|cabe|posso|consigo|da pra|como)\b/.test(l)&&!/\?\s*$/.test(t))return null;
  const m=month();

    let n=1,parc=0;const a=t.match(/(\d+)\s*x\s*de\s*(?:r\$\s*)?(\d[\d.,]*)/i);
    if(a){n=+a[1];parc=num(a[2])}else{const b=t.match(/(\d+)\s*(?:x|vezes)\b/i);if(b)n=+b[1];const v=firstNum(t.replace(/(\d+)\s*(?:x|vezes)\b/gi,' '));if(!v)return null;parc=v/Math.max(1,n)}
    const after=m.livre-parc,comp=m.entra>0?Math.round((m.fixas+m.parc+parc)/m.entra*100):0,q=n>1?n+'x de '+brl(parc):brl(parc);
    if(after<0)return 'Agora não cabe: '+q+' passa do seu livre deste mês, que é '+brl(m.livre)+'.';
    return (comp>70?'Cabe, mas aperta. ':'Cabe. ')+q+' deixa '+brl(after)+' livres neste mês, e '+comp+'% do que entra passa a ter dono.'}
  if(/parcela/.test(l)&&/(acab|termin)/.test(l)){const ap=activeParcelas(0).sort((a,b)=>a.rest-b.rest).slice(0,3);if(!ap.length)return 'Você não tem parcela ativa.';const now=NOW();
    return 'As próximas a acabar: '+ap.map(p=>{const e=new Date(now.getFullYear(),now.getMonth()+p.rest-1,1);return p.nome+' em '+MES[e.getMonth()]}).join(', ')+'.'}
  if(/(gastando mais|gasto mais|maior gasto|onde.*gast)/.test(l)){const cat={};m.gm.filter(g=>!g.entrada).forEach(g=>{const v=g.parcelas>1?g.valor_total/g.parcelas:g.valor_total;cat[g.categoria]=(cat[g.categoria]||0)+v});
    const top=Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,3);if(!top.length)return 'Ainda não tem gasto lançado este mês.';

  if(/quanto.*(posso gastar|da pra gastar|sobra|tenho livre|livre)|por dia/.test(l))return greeting();
  return null}

function viewMetas(){
  const ms=(S.profile&&S.profile.metas)||[],now=ymOf(NOW()),m0=month();
  const perMes=m=>{const f=Math.max(0,m.alvo-metaGuardado(m)),me=Math.max(1,(m.prazo||now+11)-now+1);return f/me};
  const need=ms.reduce((a,m)=>a+perMes(m),0);
  let dica;
  if(!ms.length){const r=sumAt(S.profile&&S.profile.renda,now);dica='Uma regra comum é guardar pelo menos 10% do que entra'+(r>0?': uns <b>'+brl(r*.1)+'</b> por mês':'')+'. Cria uma meta, tipo reserva de emergência ou viagem, que eu calculo quanto guardar.'}
  else if(need<=0)dica='Todas as metas estão concluídas. Bora criar a próxima?';
  else if(m0.livre>=need)dica='Pra bater suas metas, guarda <b>'+brl(need)+'</b> por mês. Este mês cabe: ainda sobram '+brl(m0.livre-need)+' depois disso.';
  else{let ok=null;for(let o=1;o<=11;o++){const x=monthAt(o);if(x.livre>=need){ok=x;break}}
    dica='Pra bater suas metas, o ideal é guardar <b>'+brl(need)+'</b> por mês, mas este mês só sobram '+brl(Math.max(0,m0.livre))+'. '+(ok?'A partir de <b>'+MES[ok.ym%12]+'</b> cabe tranquilo, e dá pra compensar lá.':'Talvez valha esticar o prazo de alguma meta.')}

    '<div class="bubble ir" style="max-width:100%;white-space:normal">'+dica+'</div>'+
